html/head_include="<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover\"><meta name=\"mobile-web-app-capable\" content=\"yes\"><meta name=\"apple-mobile-web-app-capable\" content=\"yes\"><style>html,body{margin:0;height:100%;overflow:hidden;background:#2b2420;touch-action:none}#girar{display:none;position:fixed;inset:0;z-index:99;background:#2b2420;color:#fdf6e3;font:600 22px sans-serif;text-align:center;align-items:center;justify-content:center;flex-direction:column;padding:24px}#girar b{font-size:64px;display:block;margin-bottom:16px}@media (orientation: portrait) and (pointer: coarse){#girar{display:flex}}</style><script>(function(){function completa(){if(document.fullscreenElement||document.webkitFullscreenElement)return;var el=document.documentElement;var pedir=el.requestFullscreen||el.webkitRequestFullscreen;if(pedir&&!document.fullscreenElement){try{var p=pedir.call(el,{navigationUI:'hide'});if(p&&p.then)p.then(function(){if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(function(){});}).catch(function(){});}catch(e){}}}if(matchMedia('(pointer: coarse)').matches){window.addEventListener('pointerup',completa,true);window.addEventListener('touchend',completa,true);}document.addEventListener('DOMContentLoaded',function(){var d=document.createElement('div');d.id='girar';d.innerHTML='<b>&#8635;</b>Girá el celular<br>para jugar a Viandas';document.body.appendChild(d);});})();</script>"
